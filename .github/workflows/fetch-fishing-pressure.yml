name: Fetch fishing pressure (Global Fishing Watch)

on:
  schedule:
    # Daily 07:00 UTC. GFW publishes daily; yearly fishing hours metric
    # is stable enough that unchanged runs just exit 0 with no commit.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch Global Fishing Watch apparent fishing effort
        env:
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
        run: node scripts/fetch-fishing-pressure.mjs

      - name: Open PR with updated fishing-pressure.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- src/data/fishing-pressure.json; then
            echo "No fishing-pressure changes today."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="data/fishing-pressure-$(date +%Y%m%d-%H%M%S)"
          # Build the branch from the latest remote main carrying ONLY the data
          # file. The default GITHUB_TOKEN is a GitHub App without `workflows`
          # scope, so GitHub rejects any pushed branch that appears to modify
          # .github/workflows/** — which happens when concurrent auto-merge PRs
          # advance main past this stale checkout. Resetting to origin/main keeps
          # the branch diff to the data file alone.
          cp src/data/fishing-pressure.json "$RUNNER_TEMP/data.json"
          git fetch origin main --quiet
          git checkout -B "$BRANCH" origin/main
          cp "$RUNNER_TEMP/data.json" src/data/fishing-pressure.json
          git add src/data/fishing-pressure.json
          if git diff --cached --quiet; then
            echo "Data already current on origin/main; nothing to open."
            exit 0
          fi
          git commit -m "data: daily GFW fishing-pressure refresh"
          # Rebase onto latest remote main so any workflow-file changes that landed
          # during the long GFW fetch don't cause a "workflows permission" push rejection.
          git fetch origin main
          git rebase origin/main
          git push origin "$BRANCH"
          gh pr create --repo "$REPO" \
            --base main --head "$BRANCH" \
            --title "data: daily GFW fishing-pressure refresh" \
            --body "Automated daily apparent-fishing-effort refresh from Global Fishing Watch. Auto-merges once checks are green." \
            --label automation
