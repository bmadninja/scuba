name: Validate coral cover citations (NCRMP + AGRRA)

on:
  schedule:
    # Monthly, 1st of the month 07:00 UTC. The cover values are human-
    # curated from published reports and don't change between releases;
    # this run just HEAD-checks every citation URL is still alive and
    # bumps lastBuiltAt. A 404 surfaces in the run log so a maintainer
    # can re-cite.
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate NCRMP + AGRRA citation URLs
        run: node scripts/fetch-coral-cover.mjs

      - name: Open PR with updated coral-cover.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- src/data/coral-cover.json; then
            echo "No coral-cover changes this month."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="data/coral-cover-$(date +%Y%m%d-%H%M%S)"
          # Build the branch from the latest remote main carrying ONLY the data
          # file. The default GITHUB_TOKEN is a GitHub App without `workflows`
          # scope, so GitHub rejects any pushed branch that appears to modify
          # .github/workflows/** — which happens when concurrent auto-merge PRs
          # advance main past this stale checkout. Resetting to origin/main keeps
          # the branch diff to the data file alone.
          cp src/data/coral-cover.json "$RUNNER_TEMP/data.json"
          git fetch origin main --quiet
          git checkout -B "$BRANCH" origin/main
          cp "$RUNNER_TEMP/data.json" src/data/coral-cover.json
          git add src/data/coral-cover.json
          if git diff --cached --quiet; then
            echo "Data already current on origin/main; nothing to open."
            exit 0
          fi
          git commit -m "data: monthly NCRMP/AGRRA citation refresh"
          git push origin "$BRANCH"
          gh pr create --repo "$REPO" \
            --base main --head "$BRANCH" \
            --title "data: monthly NCRMP/AGRRA citation refresh" \
            --body "Automated monthly NCRMP/AGRRA citation-URL validation and lastBuiltAt bump. Auto-merges once checks are green." \
            --label automation
