name: Fetch reef health (NOAA CRW)

on:
  schedule:
    # Daily at 06:30 UTC — NOAA CRW publishes once per day.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch NOAA Coral Reef Watch thermal stress
        run: node scripts/fetch-reef-health-live.mjs

      - name: Open PR with updated reef-health.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- src/data/reef-health.json; then
            echo "No reef-health changes today."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="data/reef-health-$(date +%Y%m%d-%H%M%S)"
          # Build the branch from the latest remote main carrying ONLY the data
          # file. The default GITHUB_TOKEN is a GitHub App without `workflows`
          # scope, so GitHub rejects any pushed branch that appears to modify
          # .github/workflows/** — which happens when concurrent auto-merge PRs
          # advance main past this stale checkout. Resetting to origin/main keeps
          # the branch diff to the data file alone.
          cp src/data/reef-health.json "$RUNNER_TEMP/data.json"
          git fetch origin main --quiet
          git checkout -B "$BRANCH" origin/main
          cp "$RUNNER_TEMP/data.json" src/data/reef-health.json
          git add src/data/reef-health.json
          if git diff --cached --quiet; then
            echo "Data already current on origin/main; nothing to open."
            exit 0
          fi
          git commit -m "data: nightly NOAA CRW thermal-stress refresh"
          git push origin "$BRANCH"
          gh pr create --repo "$REPO" \
            --base main --head "$BRANCH" \
            --title "data: nightly NOAA CRW thermal-stress refresh" \
            --body "Automated daily reef-health refresh from NOAA Coral Reef Watch. Auto-merges once checks are green." \
            --label automation
