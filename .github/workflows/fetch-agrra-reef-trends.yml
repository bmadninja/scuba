name: Fetch AGRRA reef trends

on:
  schedule:
    # Weekly, Mondays at 07:30 UTC. AGRRA rapid-assessment data updates
    # infrequently (a few surveys added per season).
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch AGRRA coral-cover trends
        run: node scripts/fetch-agrra-reef-trends.mjs

      - name: Commit updated AGRRA series
        run: |
          if git diff --quiet -- src/data/agrra-reef-series.json src/data/sources.json src/data/methodologies.json; then
            echo "No AGRRA changes this run."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/agrra-reef-series.json src/data/sources.json src/data/methodologies.json
          git commit -m "data: AGRRA coral-cover trend refresh"
          git pull --rebase
          git push
