name: PR Tests

# Enforces the Playwright suite on every human/code pull request into main,
# mirroring the local "push to prod" pre-deploy hook
# (.claude/hooks/predeploy-test.sh) so the same `npm test` gate applies whether
# code ships via git or the Vercel CLI. Branch protection on main requires the
# "Playwright suite (npm test)" check before merge.
#
# Data-automation PRs (labeled "automation" by the discovery/enrichment bots)
# skip the heavy browser suite and report success immediately: they are already
# gated by the Vercel build in auto-merge-automation.yml, and Josie's call is
# that data automation flows without the full test gate. The job still RUNS on
# those PRs and reports the required context, so branch protection is satisfied
# instead of hanging pending forever.

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright suite (npm test)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Skip note for automation PRs
        if: contains(github.event.pull_request.labels.*.name, 'automation')
        run: echo "Automation PR — skipping the Playwright suite (Vercel build gates data changes)."

      - uses: actions/checkout@v4
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'automation') }}

      - uses: actions/setup-node@v4
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'automation') }}
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'automation') }}
        run: npm ci

      - name: Install Playwright browser (chromium)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'automation') }}
        run: npx playwright install --with-deps chromium

      # Build once and serve the production bundle. `next dev` recompiles every
      # route on first request, which made the 400-test suite blow past 30 min;
      # `next start` serves instantly and is what actually ships. Playwright's
      # config has reuseExistingServer: true, so it reuses this server on :3000
      # instead of spawning `npm run dev`.
      - name: Build production bundle
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'automation') }}
        run: npm run build

      - name: Start production server
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'automation') }}
        run: |
          npm start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 >/dev/null && echo "server up" && exit 0
            sleep 2
          done
          echo "server failed to start" && exit 1

      # Exclude the "Image reachability" suite: 50 tests that probe live third
      # party CDNs (Wikimedia etc.) with per-URL network timeouts. It is slow and
      # inherently flaky, and already runs as its own separate, non-blocking
      # workflow (image-reachability.yml) — it has no place in a required merge
      # gate. 4 workers matches the runner's core count.
      - name: Run Playwright tests
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'automation') }}
        run: npx playwright test --workers=4 --retries=1 --reporter=line --grep-invert "Image reachability"

      - name: Upload Playwright report on failure
        if: ${{ failure() && !contains(github.event.pull_request.labels.*.name, 'automation') }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
