name: PR Tests

# Enforces the Playwright suite on every pull request into main, mirroring the
# local "push to prod" pre-deploy hook (.claude/hooks/predeploy-test.sh) so that
# the same `npm test` gate applies whether code ships via git or the Vercel CLI.
# Merges are blocked until this check passes (branch protection on main).

on:
  pull_request:
    branches: [main]

# Cancel superseded runs when a PR is pushed to repeatedly.
concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright suite (npm test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
